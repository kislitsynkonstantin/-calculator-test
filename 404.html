    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 40px rgba(0,0,0,.45);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--ink);
  font-family: 'Geologica', system-ui, -apple-system, sans-serif; font-weight: 300;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  line-height: 1.55;
}

/* Предпросмотр менеджера. Кнопка в полоске ссылки называется «Открыть», и по
   названию не видно, что это свой заход, а не клиентский: он нарочно не идёт
   в счёт открытий. Пока надпись отсутствовала, ловушка срабатывала — открытия
   не появлялись, и причина была не видна ниоткуда (Константин, 17.09.2026).
   Клиенту эта полоса не показывается никогда: у него в адресе нет preview=1. */
.cl-pv {
  display: flex; align-items: center; gap: 8px;
  padding: 9px clamp(14px, 3vw, 30px);
  background: var(--tint); border-bottom: 1px solid var(--rule2);
  font-size: 12px; line-height: 1.45; color: var(--ink2);
}
.cl-pv b { color: var(--acc); font-weight: 600; }
.cl-pv svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--acc); }

/* ── полоса сверху: она же шапка листа, она же печатается ─────────────────── */
.cl-bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 12px clamp(14px, 3vw, 30px);
  background: var(--sheet); border-bottom: 1px solid var(--rule);
}
/* Логотип — тот же файл, что в калькуляторе, в двух начертаниях: тёмное на
   светлой теме, светлое на тёмной. Лежит отдельными картинками, а не в base64:
   страницу открывают с телефона, и 165 КБ в каждом открытии были бы лишними,
   а так браузер их кэширует. */
.cl-logo { height: 20px; width: auto; display: block; }
.cl-logo.night { display: none; }
@media (prefers-color-scheme: dark) {
  .cl-logo.day { display: none; } .cl-logo.night { display: block; }
}
.cl-bar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.cl-pdf {
  position: relative; display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--rule2); border-radius: 8px; background: none;
  color: var(--ink2); font: inherit; font-size: .8rem; padding: 8px 14px;
  cursor: pointer;
}
.cl-pdf::before { content: ''; position: absolute; inset: -6px -4px; }
.cl-pdf svg { width: 14px; height: 14px; }
@media (hover: hover) { .cl-pdf:hover { background: var(--tint); color: var(--acc); } }

/* ── ЛИСТ ────────────────────────────────────────────────────────────────
   Это не «похожий» документ, а тот же самый: разметка и правила сняты с
   печатного «Бланка» в калькуляторе — те же классы bl-*, кегли, сетка и
   переносы на телефоне. Клиент обязан видеть ровно то, что менеджер видел
   перед отправкой и что уйдёт в PDF (Константин, 12.09.2026).
   Своего у клиента три вещи: тема от устройства, полоса сверху и то, что на
   печати полоса пропадает, а лист становится дневным.
   ────────────────────────────────────────────────────────────────────────── */
.bl-wrap { padding: clamp(16px,4vw,40px) clamp(10px,3vw,26px) 60px; }
.bl-doc {
  width: 196mm; max-width: 100%; margin: 0 auto;
  background: var(--sheet); color: var(--ink);
  font-size: 9.5pt; line-height: 1.5; font-variant-numeric: tabular-nums;
  padding: clamp(18px,4vw,34px) clamp(16px,4vw,30px);
  border-radius: 14px; box-shadow: var(--shadow);
}
.bl-doc * { box-sizing: border-box; }
.bl-logo-doc { height: 26px; width: auto; display: none; margin: 0 0 16px -2px; }
.bl-eyebrow { font-size:6.8pt; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--acc2); margin-bottom:7px; }
.bl-title { font-size:17pt; font-weight:600; letter-spacing:-.02em; line-height:1.2; color:var(--ink); }
.bl-title .bl-em { color: var(--acc); }
.bl-hr { height:1px; background:var(--rule); margin:16px 0 0; }
.bl-req { display:grid; grid-template-columns:1fr 1fr; gap:0 34px; margin-top:2px; }
.bl-req>div { display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid var(--rule); }
.bl-req span { font-size:6.8pt; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3); white-space:nowrap; }
.bl-req b { margin-left:auto; font-weight:500; font-size:9.5pt; color:var(--ink); text-align:right; }
/* Незаполненное поле — это название и место под него, как на листе менеджера.
   Раньше пустое значение уносило с собой и название: на странице оставалась
   голая линейка, про которую нечего было понять (Константин, 17.09.2026). */
.bl-fill { display:block; border-bottom:1px solid var(--rule2); flex:1; max-width:120px; height:11px; margin-left:auto; }
/* Пустая клетка сетки — распорка для выравнивания колонок, а не строка:
   своей линейки она не рисует. */
.bl-req>div:empty { border-bottom:0; }
.bl-sum { margin:26px 0 4px; padding-bottom:9px; border-bottom:2px solid var(--acc); }
.bl-total { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; }
.bl-total-k { font-size:6.8pt; letter-spacing:.2em; text-transform:uppercase; color:var(--ink3); padding-bottom:5px; }
.bl-total-k i { font-style:normal; text-transform:none; letter-spacing:.02em; white-space:nowrap; }
.bl-total-v { font-size:21pt; font-weight:600; letter-spacing:-.02em; line-height:1; color:var(--ink); }
.bl-total-v small { font-size:12pt; font-weight:400; color:var(--ink2); margin-left:4px; }
.bl-disc { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-top:11px; }
.bl-disc-k { font-size:6.8pt; letter-spacing:.2em; text-transform:uppercase; color:var(--acc2); padding-bottom:4px; }
.bl-disc-k i { font-style:normal; text-transform:none; letter-spacing:.02em; color:var(--ink3); white-space:nowrap; }
.bl-disc-v { font-size:15pt; font-weight:600; letter-spacing:-.02em; line-height:1; color:var(--acc); }
.bl-disc-v small { font-size:10pt; font-weight:400; color:var(--acc2); margin-left:3px; }
.bl-disc-sub { margin-top:5px; font-size:7.5pt; color:var(--ink3); text-align:right; }
/* Снимки — коробка с пропорцией и картинки внутри неё, как в печати: на
   телефоне они остаются рядом, а не встают друг под друга. */
.bl-imgs { position:relative; width:100%; margin:18px 0 28px; }
.bl-imgs img { position:absolute; object-fit:cover; display:block; margin:0; padding:0; border:0; background:var(--tint); }
.bl-tbl { width:100%; border-collapse:collapse; table-layout:fixed; margin-top:14px; }
.bl-sec td { padding:22px 0 7px; border-bottom:2px solid var(--acc); vertical-align:baseline; }
.bl-sec td.bl-sn { font-size:19pt; font-weight:600; color:var(--pale); letter-spacing:-.03em; line-height:1; width:47px; padding-left:7px; }
.bl-sname { font-size:11pt; font-weight:600; color:var(--ink); letter-spacing:-.01em; }
.bl-sec td.bl-ssum { font-size:11pt; font-weight:600; text-align:right; color:var(--acc); white-space:nowrap; width:139px; padding-right:7px; }
.bl-row td { padding:5px 0; border-bottom:1px solid var(--rule); vertical-align:baseline; line-height:1.4; }
.bl-row.bl-hl td { background: var(--hl); }
.bl-row td.bl-n { font-size:7.5pt; color:var(--ink3); padding-left:7px; }
.bl-name { font-size:9.5pt; color:var(--ink); padding-right:14px; }
.bl-row td.bl-v { text-align:right; white-space:nowrap; padding-right:7px; }
.bl-v-inc { font-size:8pt; color:var(--acc); letter-spacing:.02em; }
.bl-v-sum { font-size:9.5pt; color:var(--ink); font-weight:500; }
.bl-gift { display:inline-block; margin-left:6px; font-size:6.4pt; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:var(--acc); border:1px solid var(--rule2); border-radius:20px; padding:1px 7px; vertical-align:middle; }
.bl-note td { background:var(--tint); border-bottom:1px solid var(--rule); padding:6px 0;
  font-size:8.5pt; color:var(--ink2); line-height:1.4; vertical-align:baseline; }
.bl-note td.bl-n { padding-left:7px; }
.bl-strip { margin-top:22px; background:var(--strip-bg); color:var(--strip-ink); border-radius:10px; padding:14px 20px; }
.bl-strip-top { display:grid; grid-template-columns:auto auto; justify-content:space-between; align-items:baseline; column-gap:24px; }
.bl-strip-l, .bl-strip-r { display:contents; }
.bl-strip-l .bl-strip-k { grid-area:1/1; } .bl-strip-v { grid-area:2/1; }
.bl-strip-r .bl-strip-k { grid-area:1/2; color:var(--strip-ink3); } .bl-strip-disc { grid-area:2/2; }
.bl-strip-r { text-align:right; }
.bl-strip-k { font-size:6.6pt; letter-spacing:.14em; text-transform:uppercase; color:var(--strip-ink2); white-space:nowrap; }
.bl-strip-k i, .bl-strip-disc i { font-style:normal; text-transform:none; letter-spacing:.02em; }
.bl-strip-v { font-size:17pt; font-weight:600; letter-spacing:-.02em; white-space:nowrap; }
.bl-strip-disc { font-size:12pt; font-weight:600; letter-spacing:-.02em; color:var(--strip-disc); }
.bl-strip-sub { margin-top:11px; padding-top:9px; border-top:1px solid var(--strip-rule);
  font-size:7pt; color:var(--strip-ink3); display:flex; align-items:baseline; justify-content:space-between; gap:4px 16px; flex-wrap:nowrap; }
.bl-strip-sub>* { flex:0 0 auto; white-space:nowrap; }
.bl-strip-till { white-space:nowrap; margin-left:auto; }
.bl-sign { display:flex; gap:52px; margin-top:34px; }
.bl-sign>div { flex:1; }
.bl-sign .bl-line { border-bottom:1px solid var(--rule2); height:30px; }
.bl-sign .bl-who { margin-top:6px; font-size:6.8pt; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3); }
.bl-sign .bl-fio { font-size:9.5pt; font-weight:500; color:var(--ink); }
.bl-foot { margin-top:24px; padding-top:11px; border-top:1px solid var(--rule); font-size:7.5pt; line-height:1.65; color:var(--ink3); }
/* ── телефон: те же правила, что у печатного листа ───────────────────────── */
@media screen and (max-width:700px) {
  .bl-doc { width:auto; }
  .bl-req { grid-template-columns:1fr; }
  .bl-req span { white-space:normal; }
  .bl-title { font-size:14pt; }
  .bl-sum { margin-top:20px; }
  .bl-total-v { font-size:17pt; } .bl-total-v small { font-size:10pt; }
  .bl-disc-v { font-size:13pt; }
  .bl-tbl { margin-top:10px; }
  .bl-sec td { padding:16px 0 6px; }
  .bl-sec td.bl-sn { font-size:15pt; width:40px; }
  .bl-sec td.bl-sname { font-size:10pt; }
  .bl-sec td.bl-ssum { font-size:9pt; width:98px; }
  .bl-name { padding-right:8px; font-size:9pt; overflow-wrap:break-word; }
  .bl-strip { padding:12px 12px; }
  .bl-strip-top { column-gap:10px; }
  .bl-strip-sub { gap:4px 10px; font-size:6.6pt; flex-direction:column; align-items:flex-start; }
  .bl-strip-till { margin-left:0; }
  .bl-strip-k { letter-spacing:.07em; }
  .bl-strip-v { font-size:14pt; }
  .bl-strip-disc { font-size:9pt; }
  .bl-sign { gap:18px; margin-top:26px; }
}

/* ── полоска «расчёт обновлён» ────────────────────────────────────────────── */
.fresh {
  position: sticky; top: 57px; z-index: 19;
  display: none; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--acc); color: #fff; padding: 11px clamp(14px, 3vw, 30px);
  font-size: .82rem;
}
.fresh.on { display: flex; }
.fresh button {
  border: 1px solid rgba(255,255,255,.5); border-radius: 7px; background: none;
  color: #fff; font: inherit; font-size: .78rem; padding: 6px 12px; cursor: pointer;
  position: relative;
}
.fresh button::before { content: ''; position: absolute; inset: -8px -6px; }

/* ── состояния ────────────────────────────────────────────────────────────── */
.state {
  min-height: 70vh; display: grid; place-content: center; justify-items: center;
  gap: 14px; padding: 40px 22px; text-align: center;
}
.state .t {
  font-family: 'Unbounded', sans-serif; font-weight: 700;
  font-size: clamp(1rem, 3.6vw, 1.25rem); color: var(--ink);
}
.state .s { font-size: .86rem; color: var(--ink2); max-width: 44ch; line-height: 1.6; }
.state .dot {
  width: 9px; height: 9px; border-radius: 50%; background: var(--acc2);
  animation: pulse 1.2s ease-in-out infinite;
}
/* Настоящая причина — только по ?debug=1: клиенту такое читать незачем,
   а мне без неё остаётся гадать по снимку экрана. */
.state .why {
  font-family: ui-monospace, Menlo, monospace; font-size: .72rem; color: var(--ink3);
  background: var(--zebra); border: 1px solid var(--rule); border-radius: 8px;
  padding: 10px 12px; max-width: 90vw; overflow-x: auto; white-space: pre-wrap;
  text-align: left; line-height: 1.5;
}
@keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1)} }
@media (prefers-reduced-motion: reduce) { .state .dot { animation: none; opacity: .8; } }

/* ── ПЕЧАТЬ ───────────────────────────────────────────────────────────────
   Клиент нажимает «Скачать PDF» и получает тот же документ, что менеджер:
   полосы клиента нет, логотип встаёт на сам лист, поля и разрывы страниц —
   как в «Бланке», а бумага всегда дневная, даже если телефон в ночной теме.
   ────────────────────────────────────────────────────────────────────────── */
@media print {
  :root {
    --page:#fff; --sheet:#fff; --zebra:#f7fafb;
    --ink:var(--br-12в); --ink2:var(--br-41); --ink3:var(--br-60б);
    --rule:var(--br-89); --rule2:var(--br-80);
    --acc:var(--br-28); --acc2:var(--br-38); --pale:var(--br-77);
    --tint:var(--br-93); --warn:#c06010; --hl:#fff8ec;
    --strip-bg:var(--br-28); --strip-ink:#fff; --strip-ink2:rgba(255,255,255,.7);
    --strip-ink3:rgba(255,255,255,.62); --strip-rule:rgba(255,255,255,.18); --strip-disc:#ffa8a8;
  }
  @page { margin: 18mm 7mm 20mm; }
  html, body { background:#fff !important; margin:0 !important; padding:0 !important; }
  .cl-bar, .fresh, .cl-pv { display: none !important; }
  .bl-wrap { padding: 0 !important; }
  .bl-doc {
    width:auto; max-width:none; margin:0; padding:0; border-radius:0; box-shadow:none;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .bl-logo-doc { display:block !important; }
  .bl-sec, .bl-row, .bl-note, .bl-strip { break-inside: avoid; }
  .bl-sec { break-after: avoid; }
}
</style>

var SB = 'https://jogylulfstjsznduirub.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvZ3lsdWxmc3Rqc3puZHVpcnViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMDQ0NjEsImV4cCI6MjA5MTY4MDQ2MX0.cGkTkrM09ZxV3LH5wwy19ITloykao472WgppimoWiUQ';

   признак держался в состоянии записи истории плюс «это перезагрузка», а тип

function склон(н, о, д, м) {
  var х = н % 100, е = н % 10;
  return н + ' ' + (х > 4 && х < 21 ? м : е === 1 ? о : е > 1 && е < 5 ? д : м);
}
var ЗН_СКАЧАТЬ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

var ОТЛАДКА = /(^|[?&])debug=1(&|$)/.test(location.search);

function состояние(заголовок, текст, кнопка) {
  document.getElementById('корень').innerHTML =
    '<div class="state"><div class="t">' + экр(заголовок) + '</div>' +
    '<div class="s">' + экр(текст) + '</div>' +
    (кнопка ? '<button class="cl-pdf" onclick="location.reload()">Обновить страницу</button>' : '') +
    (ОТЛАДКА && ПРИЧИНА ? '<div class="why">' + экр(ПРИЧИНА) + '</div>' : '') +
    '</div>';
}

function дата(iso) {
  if (!iso) return '';
  var д = new Date(iso);
  return isNaN(д) ? '' : д.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// Лист собирается той же разметкой, что печатный «Бланк» в калькуляторе:
// таблица с двузначными номерами разделов, нумерацией «раздел.строка»,
// «Входит» или ценой у открытых «глазом» и залитыми строками примечаний.
function разделДок(р, н) {
  var сумма = р.сумма ? рубли(р.сумма) : '';
  var строки = '<tr class="bl-sec"><td class="bl-sn">' + (н < 10 ? '0' + н : н) + '</td>' +
    '<td class="bl-sname">' + экр(р.имя) + '</td>' +
    '<td class="bl-ssum">' + сумма + '</td></tr>';
  var ln = 0;
  (р.позиции || []).forEach(function (п) {
    ln++;
    var знак = п.подарок ? '<span class="bl-gift">В подарок</span>' : '';
    // «Входит» и цена — одна колонка: у позиции либо одно, либо другое,
    // поэтому пустых столбцов на листе не остаётся. Как в печати.
    var знач = п.ц
      ? '<td class="bl-v bl-v-sum">' + рубли(п.ц) + '</td>'
      : '<td class="bl-v bl-v-inc">Входит</td>';
    строки += '<tr class="bl-row' + (п.выделено ? ' bl-hl' : '') + '">' +
      '<td class="bl-n">' + н + '.' + ln + '</td>' +
      '<td class="bl-name">' + экр(п.т) + знак + '</td>' + знач + '</tr>';
  });
  (р.примечания || []).forEach(function (т) {
    ln++;
    строки += '<tr class="bl-note"><td class="bl-n">' + н + '.' + ln + '</td>' +
      '<td class="bl-note-t" colspan="2">' + экр(т) + '</td></tr>';
  });
  return строки;
}

// Снимки ставятся той же раскладкой, что на листе: коробка с пропорцией
// общего габарита и картинки в ней процентами. Старые снимки (до 12.09.2026)
// раскладки не несут — им хватает ряда в две колонки.
function снимкиДок(с) {
  var р = с.раскладка || [];
  if (!р.length) {
    var адреса = с.снимки || [];
    if (!адреса.length) return '';
    var ш = adресаШирина(адреса.length);
    return '<div class="bl-imgs" style="padding-top:31%">' + адреса.map(function (u, i) {
      return '<img src="' + экр(u) + '" alt="" loading="lazy" style="left:' +
        (i * (ш + 2.8)) + '%;top:0;width:' + ш + '%;height:100%">';
    }).join('') + '</div>';
  }
  var лев = Infinity, верх = Infinity, прав = 0, низ = 0;
  р.forEach(function (и) {
    лев = Math.min(лев, и.л); верх = Math.min(верх, и.в);
    прав = Math.max(прав, и.л + и.ш); низ = Math.max(низ, и.в + и.вы);
  });
  var Ш = прав - лев, В = низ - верх;
  if (!(Ш > 0 && В > 0)) return '';
  var картинки = р.map(function (и) {
    return '<img src="' + экр(и.src) + '" alt="" loading="lazy" style="left:' +
      ((и.л - лев) / Ш * 100).toFixed(2) + '%;top:' + ((и.в - верх) / В * 100).toFixed(2) +
      '%;width:' + (и.ш / Ш * 100).toFixed(2) + '%;height:' + (и.вы / В * 100).toFixed(2) + '%">';
  }).join('');
  return '<div class="bl-imgs" style="padding-top:' + (В / Ш * 100).toFixed(2) + '%">' +
    картинки + '</div>';
}
function adресаШирина(н) { return н > 1 ? (100 - (н - 1) * 2.8) / н : 100; }

// Цвет оформления того, кто выдал ссылку. Палитра тона лежит в странице
// вторым блоком и включается признаком на корне; логотипы тона — файлами
// рядом с основными. Незнакомый тон — бирюза: лист не ломается.
function логотип(вид, тон) {
  return '/assets/logo-bmsk-' + вид + (тон ? '-' + тон : '') + '.png';
}
function нарисовать(с, ценаДо) {
  // Тона, для которых рядом лежат файлы логотипа; незнакомый — бирюза.
  var ТОНЫ_ЛИСТА = ['sky', 'blue', 'bmsk', 'amber', 'plum', 'indigo', 'graphite', 'titan'];
  var тон = ТОНЫ_ЛИСТА.indexOf(с.тон) >= 0 ? с.тон : '';
  if (тон) document.documentElement.setAttribute('data-tone', тон);
  else document.documentElement.removeAttribute('data-tone');
  var наличные = с.наличные ? '<i> за наличные</i>' : '';
  var сСкидкой = с.доСкидки && с.доСкидки > с.итог;
  var доСкидки = сСкидкой ? с.доСкидки : с.итог;
  var срок = дата(ценаДо) || с.ценаДо || '';

  // Название разбивается на два цвета, как заголовок листа: до кавычек
  // чернилами, кавычки с именем — акцентом.
  var имя = экр(с.проект).replace(/^(.*?)(«.*)$/, '$1<span class="bl-em">$2</span>');

  var реквизиты = [['Менеджер', с.менеджер]];
  if (с.параметры !== false) реквизиты.push(['Технология', с.технология]);
  реквизиты.push(['Заказчик', с.заказчик]);
  if (с.параметры !== false) реквизиты.push([с.толщинаКлюч || 'Толщина утепления', с.утепление]);
  реквизиты.push(['Договор №', с.договор], ['Дата', с.датаДоговора]);

  var шапка = с.шапка || ('Приложение №1 к договору подряда' +
    (с.договор ? ' № ' + с.договор : '') +
    (с.датаДоговора ? ' от ' + с.датаДоговора + ' г.' : ''));

  var состав = [];
  if (с.база) состав.push('База ' + рубли(с.база));
  if (с.опции) состав.push('опции ' + рубли(с.опции));
  if (с.позиций) состав.push(склон(с.позиций, 'позиция', 'позиции', 'позиций'));

  var головаСкидки = сСкидкой
    ? '<div class="bl-disc">' +
        '<div class="bl-disc-k">Спец. цена −' + экр(с.скидка) + '%' + наличные + '</div>' +
        '<div class="bl-disc-v">' + рубли(с.итог).replace(' ₽', '') + '<small>₽</small></div>' +
      '</div>' +
      '<div class="bl-disc-sub">выгода ' + рубли(с.выгода || (доСкидки - с.итог)) +
        (срок ? ' · действительна до ' + экр(срок) : '') + '</div>'
    : '';

  var полоскаСкидки = сСкидкой
    ? '<div class="bl-strip-r">' +
        '<div class="bl-strip-k">Спец. цена −' + экр(с.скидка) + '%' + наличные + '</div>' +
        '<div class="bl-strip-disc">' + рубли(с.итог) + '</div>' +
      '</div>'
    : '';

  document.getElementById('корень').innerHTML =
    '<div class="cl-bar">' +
      '<img class="cl-logo day" src="' + логотип('dark', тон) + '" alt="Баня-МСК" width="520" height="117">' +
      '<img class="cl-logo night" src="' + логотип('light', тон) + '" alt="Баня-МСК" width="520" height="117">' +
      '<span class="right"><button class="cl-pdf" onclick="window.print()">' +
        ЗН_СКАЧАТЬ + 'Скачать PDF</button></span>' +
    '</div>' +
    '<div class="fresh" id="полоскаСвежести">' +
      '<span>Менеджер обновил расчёт.</span>' +
      '<button onclick="location.reload()">Показать новую версию</button>' +
    '</div>' +
    '<div class="bl-wrap"><div class="bl-doc">' +
      '<img class="bl-logo-doc" src="' + логотип('dark', тон) + '" alt="Баня-МСК" width="520" height="117">' +
      '<div class="bl-eyebrow">Спецификация · ' + экр(шапка) + '</div>' +
      '<div class="bl-title">' + имя + '</div>' +
      '<div class="bl-hr"></div>' +
      '<div class="bl-req">' + реквизиты.map(function (п) {
        return '<div><span>' + экр(п[0]) + '</span>' +
          (п[1] ? '<b>' + экр(п[1]) + '</b>' : '<span class="bl-fill"></span>') + '</div>';
      }).join('') + '</div>' +
      '<div class="bl-sum">' +
        '<div class="bl-total">' +
          '<div class="bl-total-k">Общая стоимость' + (сСкидкой ? '' : наличные) + '</div>' +
          '<div class="bl-total-v">' + рубли(доСкидки).replace(' ₽', '') + '<small>₽</small></div>' +
        '</div>' + головаСкидки +
      '</div>' +
      снимкиДок(с) +
      '<table class="bl-tbl"><tbody>' +
        (с.разделы || []).map(function (р, i) { return разделДок(р, i + 1); }).join('') +
      '</tbody></table>' +
      '<div class="bl-strip">' +
        '<div class="bl-strip-top">' +
          '<div class="bl-strip-l">' +
            '<div class="bl-strip-k">Общая стоимость' + (сСкидкой ? '' : наличные) + '</div>' +
            '<div class="bl-strip-v">' + рубли(доСкидки) + '</div>' +
          '</div>' + полоскаСкидки +
        '</div>' +
        '<div class="bl-strip-sub"><span>' + экр(состав.join(' · ')) + '</span>' +
          (сСкидкой && срок
            ? '<span class="bl-strip-till">действительна до ' + экр(срок) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="bl-sign">' +
        '<div><div class="bl-line"></div><div class="bl-who">Подрядчик</div>' +
          '<div class="bl-fio">' + экр(с.подпись || '') + '</div></div>' +
        '<div><div class="bl-line"></div><div class="bl-who">Заказчик</div>' +
          '<div class="bl-fio">' + экр(с.заказчикФИО || '') + '</div></div>' +
      '</div>' +
      (с.оговорка === false ? '' : '<div class="bl-foot">Наличие одной из опций на ' +
        'архитектурном решении или планировке (ступени, лестницы, декоративные элементы, ' +
        'элементы сантехники, других инженерных решений) не подразумевает их обязательное ' +
        'включение в договор.</div>') +
    '</div></div>';
}

var ВЕРСИЯ = null;

/* Открытие ссылки считается одно на приход. Пришли по ссылке заново — новое
   открытие; обновили страницу или вернулись в ту же вкладку — то же самое.
   Признак прихода держим в памяти вкладки: она переживает обновление и
   умирает вместе с вкладкой, то есть ровно совпадает с «пришли ещё раз».
   Память может быть закрыта настройками — тогда считаем приход свежим:
   потерять открытие хуже, чем посчитать обновление вторым заходом. */
/* Полоса предпросмотра стоит вне «корня»: его содержимое переписывается
   целиком при каждой отрисовке, и полоса исчезла бы вместе с ним. */
if (ПРЕДПРОСМОТР) {
  var полосаПред = document.createElement('div');
  полосаПред.className = 'cl-pv';
  полосаПред.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7' +
    '-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>' +
    '<span><b>Предпросмотр.</b> Так страницу видит клиент. ' +
    'Этот заход в счёт открытий не идёт.</span>';
  document.body.insertBefore(полосаПред, document.body.firstChild);
}

var СВЕЖИЙ = true;
// В предпросмотре отметку не ставим и памяти не трогаем: иначе свой же заход
// менеджера съедал бы признак прихода, и следующее — настоящее — открытие
// в этой вкладке считалось бы возвратом, а не приходом.
if (!ПРЕДПРОСМОТР) {
  try {
    var клЗаход = 'bm_заход_' + КОД;
    СВЕЖИЙ = !sessionStorage.getItem(клЗаход);
    sessionStorage.setItem(клЗаход, '1');
  } catch (e) {}
}

function открыть() {
  зов('client_link_get', { p_code: КОД }).then(function (о) {
    if (!о) { состояние('Не удалось открыть', 'Проверьте связь и обновите страницу.', true); return; }
    if (о.status === 'revoked') {
      состояние('Ссылка больше не действует', 'Менеджер закрыл доступ к этому расчёту. Запросите новую ссылку.');
      return;
    }
    if (о.status !== 'ok' || !о.snapshot) {
      состояние('Расчёт не найден', 'Проверьте адрес целиком — в нём восемь знаков после косой черты.');
      return;
    }
    ВЕРСИЯ = о.snapshot_at;
    document.title = (о.snapshot.проект || 'Спецификация') + ' · Баня-МСК';
    нарисовать(о.snapshot, о.price_until);
    if (!ПРЕДПРОСМОТР) зов('client_link_open', { p_code: КОД, p_version: о.snapshot_at, p_fresh: СВЕЖИЙ });
  }).catch(function () {
    состояние('Не удалось открыть', 'Проверьте связь и обновите страницу.', true);
  });
}

/* Вкладку держат открытой неделями: вернулись к ней — переспрашиваем версию.
   Цифры под читающим не подменяем, предлагаем полоской. */
var ПРОВЕРЯЕМ = false;
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible' || !ВЕРСИЯ || ПРОВЕРЯЕМ) return;
  ПРОВЕРЯЕМ = true;
  зов('client_link_get', { p_code: КОД }).then(function (о) {
    ПРОВЕРЯЕМ = false;
    if (!о || о.status !== 'ok') return;
    if (о.snapshot_at !== ВЕРСИЯ) {
      var п = document.getElementById('полоскаСвежести');
      if (п) п.classList.add('on');
    }
    if (!ПРЕДПРОСМОТР) зов('client_link_open', { p_code: КОД, p_version: ВЕРСИЯ, p_fresh: false });
  }).catch(function () { ПРОВЕРЯЕМ = false; });
});

if (КОД) открыть();
</script>
</body>
