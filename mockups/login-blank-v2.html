<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — все окна в теме «Бланк»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
:root{
  --bl-page:#f7fbfb; --bl-sheet:#fff; --bl-ink:#12262a; --bl-ink2:#5b7376; --bl-ink3:#8da3a5;
  --bl-rule:#dceaeb; --bl-rule2:#bcd9db; --bl-acc:#1e6c72; --bl-acc2:#2a8f97; --bl-tint:#e4f5f6;
  --err-bg:#fdf1f0; --err-ink:#c0392b; --ok-bg:#f0fff4; --ok-ink:#276749;
  --mk-bg:#eef3f4; --mk-panel:#fff; --mk-ink:#12262a; --mk-mut:#8da3a5; --mk-line:#dceaeb;
}
body.night{
  --bl-page:#0e1a1c; --bl-sheet:#132528; --bl-ink:#e6f3f3; --bl-ink2:#9db6b8; --bl-ink3:#8aa4a6;
  --bl-rule:#224347; --bl-rule2:#2d585d; --bl-acc:#8fd6dc; --bl-acc2:#5fc2ca; --bl-tint:#173338;
  --err-bg:#2a1a1a; --err-ink:#f0a49b; --ok-bg:#162c22; --ok-ink:#8fd6a8;
  --mk-bg:#0b1416; --mk-panel:#132528; --mk-ink:#e6f3f3; --mk-mut:#8aa4a6; --mk-line:#224347;
}
body{margin:0;background:var(--mk-bg);font-family:'Geologica',system-ui,sans-serif;color:var(--mk-ink);}

.mk-bar{position:sticky;top:0;z-index:20;background:var(--mk-panel);border-bottom:1px solid var(--mk-line);padding:12px 20px 10px;}
/* На телефоне панель занимала половину экрана и наезжала на пояснение под
   собой. Липкой она нужна на широком экране, где не мешает. */
@media(max-width:760px){.mk-bar{position:static;}}
.mk-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
.mk-t{font-weight:600;font-size:.82rem;}
.mk-t span{color:var(--mk-mut);font-weight:400;}
.mk-night{margin-left:auto;background:none;border:1px solid var(--mk-line);border-radius:8px;
  font-family:inherit;font-size:.72rem;color:var(--mk-mut);padding:6px 12px;cursor:pointer;}
.mk-night:hover{color:var(--mk-ink);border-color:var(--bl-rule2);}
.mk-grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
.mk-lbl{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mk-mut);
  min-width:132px;flex:none;}
.mk-grp button{background:none;border:1px solid var(--mk-line);border-radius:20px;font-family:inherit;
  font-size:.72rem;color:var(--mk-mut);padding:6px 13px;cursor:pointer;white-space:nowrap;}
.mk-grp button:hover{color:var(--mk-ink);border-color:var(--bl-rule2);}
.mk-grp button[aria-pressed=true]{background:var(--bl-acc);border-color:var(--bl-acc);color:#fff;font-weight:500;}
body.night .mk-grp button[aria-pressed=true]{color:#08181a;}
@media(max-width:700px){.mk-lbl{min-width:0;width:100%;}}
.mk-note{padding:14px 20px 0;max-width:900px;font-size:.78rem;line-height:1.55;color:var(--mk-mut);}
.mk-note b{color:var(--mk-ink);font-weight:600;}

.scr-wrap{padding:18px 20px 28px;display:flex;justify-content:center;}
.scr{width:100%;max-width:1080px;min-height:600px;border:1px solid var(--mk-line);border-radius:14px;
  overflow:hidden;position:relative;box-shadow:0 18px 44px rgba(18,38,42,.10);}
@media(max-width:760px){.scr-wrap{padding:12px;}.scr{min-height:540px;}}

/* ── Экран входа ───────────────────────────────────────────────────────── */
.stage{background:var(--bl-page);min-height:600px;display:flex;align-items:center;justify-content:center;
  padding:40px 20px;position:relative;}
@media(max-width:760px){.stage{min-height:540px;padding:64px 14px 26px;}}
/* Кнопка дня/ночи — тем же правилом, что кнопки шапки в «Бланке»: без рамки,
   радиус 8, чернила подписей, подсветка на наведении. Рамка вокруг иконки —
   язык «Модерна», на листе она читается как отдельная коробка. Поле нажатия
   расширено невидимо, сама кнопка не раздута. */
.moon{position:absolute;top:14px;left:14px;z-index:5;display:flex;align-items:center;justify-content:center;
  padding:8px 9px;border-radius:8px;border:0;background:none;color:var(--bl-ink2);cursor:pointer;}
.moon::before{content:'';position:absolute;inset:-6px;}
.moon:hover{background:var(--bl-tint);color:var(--bl-acc);}
.badge{position:absolute;top:20px;right:16px;z-index:5;font-size:.62rem;letter-spacing:.06em;color:var(--bl-ink3);}

.paper{width:100%;max-width:420px;background:var(--bl-sheet);padding:44px 40px 38px;
  box-shadow:0 1px 0 var(--bl-rule),0 22px 50px rgba(18,38,42,.10);}
@media(max-width:520px){.paper{padding:30px 22px 26px;}}
.paper .logo{height:26px;display:block;margin:0 0 20px -2px;}
.eyebrow{font-size:.6rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--bl-acc2);margin-bottom:8px;}
.paper h2{font-family:'Unbounded',sans-serif;font-size:1.18rem;font-weight:600;letter-spacing:-.01em;
  line-height:1.2;color:var(--bl-ink);margin:0;}
@media(max-width:520px){.paper h2{font-size:1.02rem;}}
.paper .sub{margin-top:6px;font-size:.76rem;color:var(--bl-ink2);}
.rule{height:1px;background:var(--bl-rule);margin:20px 0 4px;}

.fld{padding:9px 0 0;}
.fld label{display:block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bl-ink3);margin-bottom:2px;}
.fld .wrap{position:relative;}
.fld input{width:100%;height:44px;background:none;border:0;border-bottom:1px solid var(--bl-rule2);
  border-radius:0;color:var(--bl-ink);font-family:inherit;font-size:.9rem;padding:0 34px 0 2px;outline:none;}
.fld input::placeholder{color:var(--bl-ink3);}
.fld input:focus{border-bottom-color:var(--bl-acc2);}
.eye{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;
  color:var(--bl-ink3);padding:6px;display:flex;}
.eye::before{content:'';position:absolute;inset:-10px -8px;}
.eye:hover{color:var(--bl-acc);}

/* Сообщение: заливка без рамки и скругления — как строка-примечание на листе.
   Цвета взяты из самого калькулятора, чтобы смысл читался тем же, что и был. */
.msg{margin-top:18px;padding:9px 12px;font-size:.74rem;line-height:1.45;}
.msg.err{background:var(--err-bg);color:var(--err-ink);}
.msg.ok{background:var(--ok-bg);color:var(--ok-ink);}

.go{width:100%;margin-top:24px;height:46px;background:var(--bl-acc);color:#fff;border:1px solid var(--bl-acc);
  border-radius:8px;font-family:'Geologica',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;}
body.night .go{color:#08181a;}
.go:hover{background:var(--bl-acc2);border-color:var(--bl-acc2);}
.go[disabled]{background:none;color:var(--bl-ink3);border-color:var(--bl-rule2);cursor:default;}
.forgot{margin-top:14px;text-align:center;}
.forgot button{position:relative;background:none;border:none;cursor:pointer;font-family:inherit;font-size:.72rem;
  color:var(--bl-ink3);border-bottom:1px solid var(--bl-rule2);padding:0 0 1px;}
.forgot button::before{content:'';position:absolute;inset:-14px -18px;}
.forgot button:hover{color:var(--bl-acc);border-bottom-color:var(--bl-acc2);}

/* ── Окно поверх калькулятора ──────────────────────────────────────────── */
.behind{position:absolute;inset:0;background:var(--bl-page);padding:26px 30px;overflow:hidden;}
.behind .b-l{height:1px;background:var(--bl-rule);margin:0 0 16px;}
.behind .b-h{height:11px;width:200px;background:var(--bl-rule);margin-bottom:14px;}
.behind .b-r{height:8px;background:var(--bl-rule);margin-bottom:10px;opacity:.7;}
.dim{position:absolute;inset:0;background:rgba(18,38,42,.42);display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{width:100%;max-width:380px;background:var(--bl-sheet);border-radius:14px;overflow:hidden;
  box-shadow:0 18px 50px rgba(18,38,42,.20);}
body.night .modal{box-shadow:0 18px 50px rgba(0,0,0,.5);}
.m-head{position:relative;padding:18px 22px 0;}
.m-title{font-family:'Unbounded',sans-serif;font-size:.98rem;font-weight:600;letter-spacing:-.01em;color:var(--bl-ink);}
.m-head::after{content:'';display:block;height:2px;background:var(--bl-acc);margin-top:14px;}
.m-x{position:absolute;top:11px;right:16px;width:28px;height:28px;border-radius:8px;border:1px solid var(--bl-rule);
  background:var(--bl-sheet);color:var(--bl-ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.m-x::before{content:'';position:absolute;inset:-8px;}
.m-x:hover{color:var(--bl-ink);border-color:var(--bl-rule2);}
.m-body{padding:6px 22px 24px;}
.m-user{text-align:center;padding-top:14px;}
.m-user .em{font-size:.8rem;color:var(--bl-ink2);margin-bottom:16px;}
.m-user button{position:relative;background:none;border:1px solid var(--bl-rule2);border-radius:8px;padding:9px 22px;
  font-family:inherit;font-size:.76rem;color:var(--bl-ink2);cursor:pointer;}
.m-user button:hover{color:var(--bl-acc);border-color:var(--bl-acc2);}
[hidden]{display:none !important;}
</style></head>
<body>

<div class="mk-bar">
  <div class="mk-top">
    <div class="mk-t">Макет <span>вход — все окна и состояния, тема «Бланк»</span></div>
    <button class="mk-night" id="nightBtn" onclick="ночь()">Ночь</button>
  </div>
  <div class="mk-grp" id="g1">
    <span class="mk-lbl">Экран входа</span>
    <button data-s="idle" aria-pressed="true">Пусто</button>
    <button data-s="bad">Неверный пароль</button>
    <button data-s="noemail">Нет email для сброса</button>
    <button data-s="sent">Письмо отправлено</button>
    <button data-s="offline">Нет соединения</button>
    <button data-s="busy">Идёт вход</button>
  </div>
  <div class="mk-grp" id="g2">
    <span class="mk-lbl">Окно поверх расчёта</span>
    <button data-s="m-login">Вход в аккаунт</button>
    <button data-s="m-new">Новый пароль</button>
    <button data-s="m-user">Аккаунт</button>
  </div>
</div>

<div class="mk-note" id="note"></div>

function показать(к){
  const с = С[к];
  document.querySelectorAll('.mk-grp button').forEach(б=>б.setAttribute('aria-pressed', String(б.dataset.s===к)));
  document.getElementById('note').innerHTML = с.пояснение;
  document.getElementById('stage').hidden = с.где!=='экран';
  document.getElementById('over').hidden  = с.где!=='окно';
  if (с.где==='экран'){
    const м=document.getElementById('msg');
    м.hidden = !с.сообщение;
    if (с.сообщение){ м.className='msg '+с.сообщение[0]; м.textContent=с.сообщение[1]; }
    const g=document.getElementById('go');
    g.textContent=с.кнопка; g.disabled=!!с.занята;
  } else {
    document.getElementById('mTitle').textContent = с.титул;
    document.getElementById('mForm').hidden  = с.режим!=='форма';
    document.getElementById('mReset').hidden = с.режим!=='сброс';
    document.getElementById('mUser').hidden  = с.режим!=='вошёл';
    document.getElementById('mGo').hidden    = с.режим==='вошёл';
    document.getElementById('mForgot').hidden= !с.забыли;
    const м=document.getElementById('mMsg');
    м.hidden = !с.сообщение;
    if (с.сообщение){ м.className='msg '+с.сообщение[0]; м.textContent=с.сообщение[1]; }
    if (с.кнопка) document.getElementById('mGo').textContent=с.кнопка;
  }
}

function ночь(){
  const b=document.body.classList.toggle('night');
  document.getElementById('nightBtn').textContent = b ? 'День' : 'Ночь';
  // Логотип в тёмной теме белый — как в самом калькуляторе. Тёмный на тёмном
  // просто пропадал.
  const л=document.getElementById('logo'); if(л) л.src = b ? ЛОГО_НОЧЬ : ЛОГО_ДЕНЬ;
  const и=document.getElementById('moonIcon'); if(и) и.innerHTML = b ? СОЛНЦЕ : ЛУНА_П;
}
function глаз(б){
  const п=б.parentNode.querySelector('input');
  п.type = п.type==='password' ? 'text' : 'password';
}
