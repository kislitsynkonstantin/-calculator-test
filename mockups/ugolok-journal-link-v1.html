/* Цвета — «Зелёный-графит», «Бланк», как в калькуляторе. */
:root{--page:#eef0ec;--sheet:#fff;--line:#cacfc4;--rule:#e3e4e3;--ink:#1e201c;--ink2:#6e726b;--ink3:#9a9c97;
  --acc:#4f7d26;--acc-l:#70ad34;--tint:#edf5e5;--warm-tint:#fbf3e3;--warm-ink:#94600f;--shadow:0 14px 34px rgba(0,0,0,.14);--mock:#24271f}
body.dark{--page:#151614;--sheet:#1d1f1c;--line:#5f7a48;--rule:#353f2d;--ink:#edefea;--ink2:#a9ada6;--ink3:#9a9e96;
  --acc:#a8d27f;--acc-l:#83c445;--tint:#262e21;--warm-tint:rgba(224,163,58,.12);--warm-ink:#e8b86a;--shadow:0 14px 34px rgba(0,0,0,.5);--mock:#0e0f0d}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font-family:'Geologica',system-ui,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;padding-bottom:60px}
button{font:inherit;color:inherit}

.mk{background:var(--mock);color:#e9ebe6;padding:14px 16px 16px}
.mk-in{max-width:1120px;margin:0 auto}
.mk h1{font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:700;letter-spacing:-.01em}
.mk p{margin-top:6px;font-size:.8rem;line-height:1.5;color:#b9bdb5;max-width:720px}
.mk-row{display:flex;gap:6px;margin-top:12px;align-items:center}
.mk-row span{font-size:.62rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8e938a;margin-right:4px}
.mk-b{position:relative;height:32px;padding:0 12px;border:1px solid #4a5042;border-radius:16px;background:none;color:#dfe2da;font-size:.74rem;font-weight:600;cursor:pointer}
.mk-b[aria-pressed="true"]{background:#83c445;border-color:#83c445;color:#1b1d17}

.grid{max-width:1120px;margin:22px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(316px,100%),1fr));gap:28px 24px}
.v{display:flex;flex-direction:column;align-items:center}
.v-h{width:316px;max-width:100%}
.v-no{font-family:'Unbounded',sans-serif;font-size:1.5rem;font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--acc-l)}
.v-nm{margin-top:6px;font-family:'Unbounded',sans-serif;font-size:.78rem;font-weight:600}
.v-why{margin-top:4px;font-size:.72rem;line-height:1.45;color:var(--ink2);min-height:3em}

/* ── Окно уголка (как в калькуляторе) ── */
.card{position:relative;margin-top:12px;width:316px;max-width:100%;padding:14px 16px 16px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.x,.ic{position:absolute;top:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:none;color:var(--ink3);cursor:pointer}
.x{right:8px}
.x::before,.ic::before{content:'';position:absolute;inset:-7px -3px}
.ic{right:48px;color:var(--acc)}
.ic::before{inset:-7px}
.k{font-size:.54rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.nm{margin-top:4px;padding-right:26px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:.8rem;line-height:1.35;letter-spacing:-.01em}
.v2 .nm{padding-right:80px}
.tabs{display:flex;align-items:center;gap:18px;margin-top:10px;border-bottom:1px solid var(--rule)}
.tab{position:relative;display:flex;align-items:center;gap:6px;height:34px;padding:0;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--ink2);font-size:.74rem;font-weight:500}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--acc-l)}
.pane{display:flex;flex-direction:column;height:430px;margin:0 -6px -8px;padding:0 6px 8px}
.sc{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -6px;padding:0 6px;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);mask-image:linear-gradient(#000 calc(100% - 22px),transparent)}
.sc.end{-webkit-mask-image:none;mask-image:none}
.lg{list-style:none;padding:0;margin:6px 0 0}
.lg li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.lg li:last-child{border-bottom:0}
.lg .day{display:block;border:0;padding:10px 0 0;font-size:.58rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.t{font-size:.66rem;color:var(--ink2);white-space:nowrap;padding-top:2px}
.w{font-size:.72rem;line-height:1.4}
.w b{font-weight:600}
.d{grid-column:2;font-size:.68rem;color:var(--ink2);line-height:1.4}
.ar{display:inline-block;margin-left:4px;transition:transform .15s}

/* 1 · В строке вкладок */
.tl{position:relative;margin-left:auto;display:flex;align-items:center;gap:4px;height:34px;padding:0;border:0;background:none;color:var(--acc);font-size:.7rem;font-weight:600;cursor:pointer;white-space:nowrap}
.tl::before{content:'';position:absolute;inset:-5px -6px}
/* Самые узкие телефоны: вкладки плотнее, чтобы ссылка встала в строку. */
@media (max-width:359px){.tabs{gap:10px}}
/* 3 · Сводка над лентой */
.sum{display:flex;align-items:center;gap:10px;padding:9px 0 8px;border-bottom:1px solid var(--rule);font-size:.68rem;color:var(--ink2)}
.sum a,.sum button{position:relative;margin-left:auto;border:0;background:none;padding:0;color:var(--acc);font-size:.7rem;font-weight:600;cursor:pointer;white-space:nowrap}
.sum button::before{content:'';position:absolute;inset:-14px -8px}
/* 4 · Последней строкой ленты */
.lg li.more{display:block;padding:0;border:0}
.lg li.more button{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:10px 12px;margin:8px 0 2px;border:0;border-radius:10px;background:var(--tint);color:var(--acc);font-size:.72rem;font-weight:600;text-align:left;cursor:pointer}
.lg li.more small{display:block;font-size:.64rem;font-weight:400;color:var(--ink2)}
/* 5 · Тихий подвал */
.foot{flex:none;display:flex;align-items:center;justify-content:space-between;margin-top:4px;padding-top:10px;border-top:1px solid var(--rule)}
.foot .n{font-size:.66rem;color:var(--ink3)}
.foot button{position:relative;display:flex;align-items:center;gap:4px;border:0;background:none;padding:0;color:var(--acc);font-size:.72rem;font-weight:600;cursor:pointer}
.foot button::before{content:'';position:absolute;inset:-14px -8px}

@media (hover:hover){.tl:hover .ar,.sum button:hover .ar,.foot button:hover .ar,.lg li.more button:hover .ar{transform:translateX(3px)}.ic:hover,.lg li.more button:hover{background:var(--tint)}}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.toast{position:fixed;left:50%;top:14px;z-index:9;transform:translate(-50%,-10px);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:12px;background:#24271f;color:#f1f3ee;font-size:.76rem;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.ar,.toast{transition:none}}
</style>
</head>
<body>
<header class="mk"><div class="mk-in">
  <h1>Журнал уголка — где открывать полный журнал</h1>
  <p>Пять вариантов для кнопки «Открыть в журнале действий» во вкладке «Журнал» окна уголка. Лента у всех та же, что на твоём снимке, высота окна одна. Ссылки нажимаются — покажут, что откроется.</p>
  <div class="mk-row" role="group" aria-label="Тема"><span>Тема</span>
    <button class="mk-b" type="button" data-t="day" aria-pressed="true">День</button>
    <button class="mk-b" type="button" data-t="night" aria-pressed="false">Ночь</button>
  </div>
</div></header>

<main class="grid" id="grid"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var ИКОНКА_ЖУРНАЛ = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h8M3 6h.01M3 12h.01M3 18h.01"/><path d="M17 15l4 3-4 3"/></svg>';
  var КРЕСТ = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var ЛЕНТА = [['Сегодня'],
    ['19:58', 'Ссылка выдана клиенту', 'Код: y76fb3ny'],
    ['19:58', 'Спецификация в теме «Бланк» отправлена на печать', ''],
    ['19:58', 'Пресет открыт', ''],
    ['11:10', 'Пресет открыт', ''],
    ['10:29', 'Набор опций изменён', 'Добавлены: Водосточная система (пластик)'],
    ['10:28', 'Пресет открыт', ''],
    ['09:28', 'Пресет открыт', ''],
    ['26 сентября'],
    ['23:11', 'Расчёт сохранён в пресет', 'Итог: 4 595 345 ₽']];
  function лента(хвост) {
    return '<ul class="lg">' + ЛЕНТА.map(function (р) {
      if (р.length === 1) return '<li class="day">' + р[0] + '</li>';
      return '<li><span class="t">' + р[0] + '</span><span class="w"><b>Вы</b> — ' + р[1] + '</span>' + (р[2] ? '<span class="d">' + р[2] + '</span>' : '') + '</li>';
    }).join('') + (хвост || '') + '</ul>';
  }
  function шапка(доп, класс) {
    return '<div class="card ' + (класс || '') + '">' + (доп || '') + '<button class="x" type="button" aria-label="Закрыть">' + КРЕСТ + '</button>'
      + '<div class="k">Мой пресет</div><div class="nm">Фахверковая баня «Неаполь» 6×6 · 26.09.26</div>';
  }
  function вкладки(справа) {
    return '<div class="tabs"><span class="tab">Пресет</span><span class="tab on">Журнал</span><span class="tab">Проверка</span>' + (справа || '') + '</div>';
  }
  var СТРЕЛКА = '<span class="ar" aria-hidden="true">→</span>';
  var В = [
    { н: 'В строке вкладок', п: 'Ссылка «В журнал» справа от «Проверки», только на вкладке «Журнал». Лента получает всю высоту окна, ссылка видна сразу.',
      h: шапка() + вкладки('<button class="tl" type="button" data-go>В журнал' + СТРЕЛКА + '</button>') + '<div class="pane"><div class="sc">' + лента() + '</div></div></div>' },
    { н: 'Значок в шапке', п: 'Значок журнала рядом с крестиком — самое тихое место. Подпись видна при наведении и в подсказке для экранного диктора.',
      h: шапка('<button class="ic" type="button" data-go aria-label="Открыть в журнале действий" title="Открыть в журнале действий">' + ИКОНКА_ЖУРНАЛ + '</button>', 'v2') + вкладки() + '<div class="pane"><div class="sc">' + лента() + '</div></div></div>' },
    { н: 'Сводка над лентой', п: 'Строка «сколько и за какой срок» над списком, ссылка справа. Сразу видно, что лента — это весь журнал пресета, а подробности — в полном.',
      h: шапка() + вкладки() + '<div class="pane"><div class="sum">9 действий · за всё время<button type="button" data-go>В журнал действий' + СТРЕЛКА + '</button></div><div class="sc">' + лента() + '</div></div></div>' },
    { н: 'Последней строкой ленты', п: 'Ничего не приколото: в конце ленты — строка-переход. Долистал до конца — предложение открыть полный журнал. Кадр показан уже долистанным.',
      h: шапка() + вкладки() + '<div class="pane"><div class="sc" data-end>' + лента('<li class="more"><button type="button" data-go><span>Открыть в журнале действий<small>с отбором по этому пресету, за всё время</small></span>' + СТРЕЛКА + '</button></li>') + '</div></div></div>' },
    { н: 'Тихий подвал', п: 'Внизу, как сейчас, но без рамки: линейка, слева число действий, справа ссылка. Место то же, а вес — как у подписи, а не у главной кнопки.',
      h: шапка() + вкладки() + '<div class="pane"><div class="sc">' + лента() + '</div><div class="foot"><span class="n">9 действий</span><button type="button" data-go>Открыть в журнале действий' + СТРЕЛКА + '</button></div></div></div>' }
  ];
  var г = document.getElementById('grid');
  г.innerHTML = В.map(function (в, i) {
    return '<section class="v"><div class="v-h"><div class="v-no">0' + (i + 1) + '</div><div class="v-nm">' + в.н + '</div><div class="v-why">' + в.п + '</div></div>' + в.h + '</section>';
  }).join('');
  document.querySelectorAll('.sc').forEach(function (с) {
    var край = function () { с.classList.toggle('end', с.scrollTop + с.clientHeight >= с.scrollHeight - 2); };
    if (с.hasAttribute('data-end')) с.scrollTop = с.scrollHeight;
    с.addEventListener('scroll', край, { passive: true }); край();
  });
  function тост(т) { var э = document.getElementById('toast'); э.textContent = т; э.classList.add('show'); clearTimeout(тост.т); тост.т = setTimeout(function () { э.classList.remove('show'); }, 2400); }
  document.querySelectorAll('[data-go]').forEach(function (б) { б.onclick = function () { тост('Откроется журнал действий с отбором по этому пресету, за всё время'); }; });
  document.querySelectorAll('[data-t]').forEach(function (б) { б.onclick = function () {
    document.body.classList.toggle('dark', б.dataset.t === 'night');
    document.querySelectorAll('[data-t]').forEach(function (х) { х.setAttribute('aria-pressed', х === б); }); }; });
})();
</script>
</body>
</html>
