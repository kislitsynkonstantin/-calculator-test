<div id="mkIntro" class="mk" role="region" aria-label="Переключатели макета">

    <b>Стекло</b>
    <span>макет на настоящей странице калькулятора; каталог и цены придуманы</span>
  </div>
  <div class="mk-row">
    <label class="mk-sw"><input type="checkbox" id="mkGlass" checked><i aria-hidden="true"></i><span>Стекло</span></label>

    <button type="button" data-w="print">Печать</button>
